# Local stack: MySQL + the API. Needs JWT_SECRET (base64, 256-bit) in .env.
# Docs: http://localhost:8000/api/docs
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wms
      MYSQL_USER: wms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wms}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: wms
      DB_USERNAME: wms
      DB_PASSWORD: ${MYSQL_PASSWORD:-wms}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVER_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  db-data:
