spring:
  config:
    import: optional:dotenv
  application:
    name: Warehouse Management System
  profiles:
    # dev when run from the IDE; the Docker image sets SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # url lives in application-dev.yaml / application-prod.yaml
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

springdoc:
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8000}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
